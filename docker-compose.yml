services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Dev-only credentials — never use these values in production
      - POSTGRES_DB=homely_db
      - POSTGRES_USER=homely_user
      - POSTGRES_PASSWORD=homely_pass
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    command: sh -c "python manage.py migrate && uvicorn homely_core.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://homely_user:homely_pass@db:5432/homely_db
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
    depends_on:
      - db
      - redis

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info

  celery:
    build: .
    command: celery -A homely_core worker -l info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://homely_user:homely_pass@db:5432/homely_db
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
    depends_on:
      - db
      - redis
      - flaresolverr

  frontend:
    build:
      context: ../HomelyFrontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../HomelyFrontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
